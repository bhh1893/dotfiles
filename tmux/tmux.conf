# ~/.config/tmux/tmux.conf
# Copy into place: mkdir -p ~/.config/tmux && cp ~/dotfiles/tmux/tmux.conf ~/.config/tmux/tmux.conf

# ---- Prefix: Ctrl+Space -----

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload this file: prefix r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ---- Neovim-friendly settings -----

set -sg escape-time 0          # no delay after Esc (otherwise leaving insert mode lags)
set -g focus-events on         # lets Neovim notice focus changes (autoread, gitsigns refresh)
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"   # true color, so themes look the same as outside tmux
set -g history-limit 50000
set -g set-clipboard on        # copy from Neovim / copy mode reaches the system clipboard

# ---- Panes and windows -----

set -g base-index 1            # windows start at 1
setw -g pane-base-index 1      # panes start at 1
set -g renumber-windows on     # close window 2 of 3, and 3 becomes 2

# Navigate panes: prefix + h / j / k / l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes: prefix + H / J / K / L (keep tapping without pressing the prefix again)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Show each pane's number on its top border; prefix q then a number jumps to that pane
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_current_command} "
set -g display-panes-time 2000

# Splits and new windows open in the current folder: prefix | and prefix -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Copy mode with Vim keys: prefix [ then v to select, y to copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---- Iceberg colors -----

bg="#161821"
bg_light="#1e2132"
fg="#c6c8d1"
comment="#6b7089"
border="#444b71"
blue="#84a0c6"
cyan="#89b8c2"
green="#b4be82"
purple="#a093c7"

set -g status-position top
set -g status-style "bg=$bg_light,fg=$fg"
set -g status-left-length 30
# Session name; turns purple while the prefix is held
set -g status-left "#{?client_prefix,#[bg=$purple],#[bg=$blue]}#[fg=$bg,bold] #S #[default] "
set -g status-right "#[fg=$comment]%Y-%m-%d #[fg=$fg]%H:%M "

setw -g window-status-format "#[fg=$comment] #I #W "
setw -g window-status-current-format "#[bg=$border,fg=$fg,bold] #I #W "
setw -g window-status-separator ""

set -g pane-border-style "fg=$border"
set -g pane-active-border-style "fg=$blue"
set -g display-panes-colour "$comment"
set -g display-panes-active-colour "$cyan"

set -g message-style "bg=$bg_light,fg=$cyan"
set -g message-command-style "bg=$bg_light,fg=$cyan"
setw -g mode-style "bg=$border,fg=$fg"
setw -g clock-mode-colour "$green"
