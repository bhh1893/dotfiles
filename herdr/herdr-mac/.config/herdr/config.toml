onboarding = false

[theme.custom]
panel_bg = "#161821"
sidebar_bg = "#1e2132"
active_row_bg = "#272c42"
selection_bg = "#272c42"
accent = "#84a0c6"
green = "#b4be82"
red = "#e27878"

[ui]
accent = ""
prompt_new_tab_name = false

[ui.sidebar.agents]
rows = [["state_icon", "machine", "workspace", "tab"], ["terminal_title_stripped"]]

[keys]
prefix = "ctrl+space"

# Panes
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
resize_mode = ""

# Splits
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
zoom = "prefix+z"

# Workspaces
next_workspace = "prefix+shift+j"
previous_workspace = "prefix+shift+k"
new_workspace = "prefix+t"

# Agents
previous_agent = "prefix+shift+h"
next_agent = "prefix+shift+l"

# herdr
goto = "prefix+f"
toggle_sidebar = "prefix+b"
reload_config = "prefix+r"
edit_scrollback = "prefix+["

[terminal]
new_cwd = "follow"
